# Job name `gate` is the check the world ruleset requires.
name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: branch contract
        if: github.event_name == 'pull_request'
        run: |
          REF="${GITHUB_HEAD_REF}"
          echo "head=$REF"
          if echo "$REF" | grep -Eq '^packet/P-[0-9]{8}-[a-z0-9]+$'; then
            echo "packet branch OK"
          elif echo "$REF" | grep -Eq '^onboarding/[A-Za-z0-9._/-]+$'; then
            echo "onboarding catalog OK"
          else
            echo "branch must be packet/P-YYYYMMDD-xxxx or onboarding/..."
            exit 1
          fi
      - name: ready-gate
        run: |
          pip install -e .
          python -m unittest discover -s tests -t . -v
